<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAGE MAGE — Réflexes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090B;--surface:#121419;--surface-2:#191C22;--line:#242830;
  --text:#ECEEF2;--muted:#7C8492;--dim:#4A505C;
  --accent:#5B8DEF;--ok:#3FB68B;--ko:#E5484D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
  display:flex;justify-content:center;padding:18px 14px 70px;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:700px}
.mono{font-family:"JetBrains Mono",monospace}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.brand{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent)}
.toggles{display:flex;gap:6px}
.tg{background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.tg:hover{border-color:var(--muted);color:var(--text)}
.tg[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(91,141,239,.08)}

.viewtabs{display:flex;gap:6px;margin-bottom:14px}
.vt{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:500;padding:10px;border-radius:10px;cursor:pointer;transition:.15s}
.vt[aria-pressed="true"]{background:var(--surface-2);border-color:#333844;color:var(--text);font-weight:700}

.subtests{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.subtests::-webkit-scrollbar{display:none}
.st{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;
  font-weight:500;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.15s}
.st:hover{color:var(--text)}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06070A;font-weight:700}
.packs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pk{background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11.5px;
  padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s}
.pk:hover{color:var(--text);border-color:#333844}
.pk[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(91,141,239,.08)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px 24px;
  text-align:center;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.card.ok::after{background:var(--ok);transform:scaleX(1)}
.card.ko::after{background:var(--ko);transform:scaleX(1)}
.card.rev{border-color:#2E3440;background:#0F1116}
.tag{display:inline-block;background:var(--surface-2);color:var(--muted);font-size:9.5px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:20px}
.tag.revmark{background:rgba(91,141,239,.12);color:var(--accent)}
.q{font-size:clamp(19px,4.4vw,27px);font-weight:700;line-height:1.32}
.q.small{font-size:clamp(15.5px,3.3vw,19px);font-weight:500;line-height:1.5}
.memo{margin-top:20px;text-align:left;background:var(--surface-2);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;line-height:1.55;color:#B6BDC9}
.memo b{color:var(--text);font-weight:500}
.memo[hidden]{display:none}
.verdict{margin-top:16px;min-height:18px;font-size:13px;font-weight:500;font-family:"JetBrains Mono",monospace;line-height:1.5}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}

.opts{display:grid;gap:8px;margin-top:18px;text-align:left}
.opt{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;
  font-size:14.5px;line-height:1.4;padding:13px 16px;border-radius:11px;cursor:pointer;transition:.12s;
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%}
.opt:hover:not(:disabled){background:#22262E;border-color:#333844}
.opt .lt{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--dim);flex-shrink:0;padding-top:1px}
.opt.good{border-color:var(--ok);background:rgba(63,182,139,.1)}
.opt.good .lt{color:var(--ok)}
.opt.bad{border-color:var(--ko);background:rgba(229,72,77,.1)}
.opt.bad .lt{color:var(--ko)}
.opt:disabled{cursor:default}

.navbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.nb{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:13px;
  padding:10px 15px;border-radius:11px;cursor:pointer;transition:.15s;min-width:52px}
.nb:hover:not(:disabled){color:var(--text);border-color:#333844}
.nb:disabled{opacity:.3;cursor:default}
.navlabel{font-size:11.5px;color:var(--dim);font-family:"JetBrains Mono",monospace;flex:1;text-align:center}
.navlabel b{color:var(--accent);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.stat{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:700;margin-top:4px}

.row{display:flex;gap:8px;margin-bottom:8px}
#answer{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 17px;
  color:var(--text);font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500;outline:none;transition:.15s;min-width:0}
#answer:focus{border-color:var(--accent)}
#answer::placeholder{color:#3E4450}
.btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
  font-weight:500;padding:14px 22px;border-radius:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#22262E}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06070A;font-weight:700}
.btn.primary:hover{background:#6E9BF2}
.btn.wide{width:100%;color:var(--muted);font-size:13px}
.btn.wide:hover{color:var(--text)}
[hidden]{display:none!important}

.review{margin-top:22px}
.review h2{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(229,72,77,.09);border:1px solid rgba(229,72,77,.26);color:#F09296;font-size:12px;padding:5px 10px;border-radius:8px}
.chip span{color:#8A5C5F;margin-left:5px}
.empty{color:var(--dim);font-size:13px}
.foot{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--dim);font-size:11px}
.foot button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.foot button:hover{color:var(--muted)}

/* mémos */
.memosec{border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;background:var(--surface)}
.memohd{width:100%;background:none;border:none;color:var(--text);font-family:inherit;font-size:14px;font-weight:700;
  text-align:left;padding:15px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.memohd:hover{background:var(--surface-2)}
.memohd .arw{color:var(--dim);font-size:12px;transition:transform .18s}
.memosec.open .memohd .arw{transform:rotate(90deg);color:var(--accent)}
.memobd{padding:0 18px 16px;display:none}
.memosec.open .memobd{display:block}
.ml{display:flex;gap:10px;padding:7px 0;border-top:1px solid #1B1E24;font-size:13.5px;line-height:1.5}
.ml:first-child{border-top:none}
.ml .t{color:var(--accent);font-weight:500;flex-shrink:0;min-width:34%;font-family:"JetBrains Mono",monospace;font-size:12.5px}
.ml .d{color:#B6BDC9}
.ml.plain{color:#B6BDC9;display:block}
@media (max-width:520px){ .ml{flex-direction:column;gap:2px} .ml .t{min-width:0} }
@media (max-width:420px){ .btn{padding:14px 14px} .opt{font-size:13.5px;padding:12px 13px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">TAGE MAGE · <b>Réflexes</b></div>
    <div class="toggles">
      <button class="tg" id="hintBtn" aria-pressed="true">Indices</button>
      <button class="tg" id="autoBtn" aria-pressed="true">Auto</button>
    </div>
  </header>

  <div class="viewtabs">
    <button class="vt" id="vTrain" aria-pressed="true">Entraînement</button>
    <button class="vt" id="vMemo" aria-pressed="false">Mémos</button>
  </div>

  <div class="subtests" id="subtests"></div>

  <!-- ENTRAÎNEMENT -->
  <div id="trainView">
    <div class="packs" id="packs"></div>

    <div class="card" id="card">
      <div class="tag" id="tag">—</div>
      <div class="q" id="question">—</div>
      <div class="opts" id="optsZone"></div>
      <div class="memo" id="memo" hidden></div>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="navbar">
      <button class="nb" id="prev" title="Correction précédente">←</button>
      <div class="navlabel" id="navlabel"></div>
      <button class="nb" id="nextBtn" title="Suivant">→</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Score</div><div class="v" id="sScore">0/0</div></div>
      <div class="stat"><div class="k">Série</div><div class="v" id="sStreak">0</div></div>
      <div class="stat"><div class="k">Temps moy.</div><div class="v" id="sTime">—</div></div>
    </div>

    <div id="inputZone">
      <div class="row">
        <input id="answer" autocomplete="off" spellcheck="false" placeholder="Réponse">
        <button class="btn primary" id="check">Vérifier</button>
      </div>
      <button class="btn wide" id="reveal">Voir la réponse</button>
    </div>

    <div class="review">
      <h2>À revoir</h2>
      <div class="chips" id="chips"><span class="empty">Rien pour l'instant. Les erreurs reviennent plus souvent.</span></div>
    </div>

    <div class="foot">
      <span>Entrée valide · 1-5 pour les QCM · ← → pour revoir</span>
      <button id="reset">Remettre à zéro</button>
    </div>
  </div>

  <!-- MÉMOS -->
  <div id="memoView" hidden>
    <div id="memoBody"></div>
  </div>

</div>

}

 {id:"expression",name:"Expression",packs:["proverbes","proverbesR","expressions","paronymes","fautes","subjonctif","prepos","pleonasmes","figures"]},
 {id:"comprehension",name:"Compréhension",packs:["vocab","vocabR","connecteurs","prefixes","paronymes"]},
 {id:"tout",name:"Tout",packs:null}
];
var PN={carres:"Carrés",cubes:"Cubes",puiss:"Puissances",fractions:"Fractions ↔ %",tables:"Tables 11-19",
racines:"Racines",premiers:"Premiers",formules:"Formules",unites:"Unités",pourcent:"Pourcentages",divisib:"Divisibilité",
rang:"Rang lettres",rangInv:"Rang inversé",decal:"Décalages",series:"Séries",serietypes:"Types de séries",
implic:"Implications",quantif:"Quantificateurs",formelle:"Logique formelle",sophismes:"Sophismes",
sophismesR:"Sophismes ↔",raisonnements:"Types de raisonnement",argum:"Affaiblir / renforcer",
cmDrill:"Réflexe A→E",cmSens:"Sens des réponses",cmPieges:"Pièges classiques",
proverbes:"Proverbes",proverbesR:"Proverbes ↔",expressions:"Expressions",paronymes:"Paronymes",
fautes:"Fautes classiques",subjonctif:"Indicatif / subjonctif",prepos:"Constructions verbales",
pleonasmes:"Pléonasmes",figures:"Figures de style",
vocab:"Vocabulaire",vocabR:"Vocabulaire ↔",connecteurs:"Connecteurs",prefixes:"Préfixes et suffixes"};

/* ======================= ÉTAT ======================= */
var S={view:"train",sub:"calcul",pack:"__all__",hints:true,auto:true,
       right:0,total:0,streak:0,times:[],misses:{},cur:null,answered:false,t0:0,
       hist:[],hi:-1,timer:null};

var $=function(i){return document.getElementById(i);};
var card=$("card"),tagEl=$("tag"),qEl=$("question"),memo=$("memo"),verdict=$("verdict"),
    input=$("answer"),chips=$("chips"),optsZone=$("optsZone"),inputZone=$("inputZone");

function persist(){store.set({m:S.misses});}

/* ======================= GÉNÉRATION ======================= */
function activePacks(){
  var st=SUBTESTS.filter(function(x){return x.id===S.sub;})[0];
  var l=st.packs?st.packs.slice():Object.keys(PACKS);
  if(S.pack!=="__all__"&&l.indexOf(S.pack)>-1)l=[S.pack];
  return l;
}
function buildOne(){
  var id=pick(activePacks()),P=PACKS[id];
  if(P.kind==="gen"){
    var it=P.gen();it.tag=P.tag;it.type=it.opts?"qcm":"input";
    if(it.opts)it.options=shuffle(it.opts.slice());
    return it;
  }
  var item=pick(P.items),opts=item.opts;
  if(!opts){
    var pool=P.items.filter(function(x){return x.a!==item.a;});shuffle(pool);
    var d=[];for(var i=0;i<pool.length&&d.length<3;i++)if(d.indexOf(pool[i].a)===-1)d.push(pool[i].a);
    opts=[item.a].concat(d);
  }
  return {key:P.tag+"|"+item.key,q:item.q,a:item.a,options:shuffle(opts.slice()),tag:P.tag,type:"qcm",
          h:item.h,lab:item.lab||shorten(item.a),small:item.small};
}
function drawQuestion(){
  var q=buildOne();
  var missed=Object.keys(S.misses).filter(function(k){return k.indexOf("|lab")===-1;});
  if(missed.length&&Math.random()<.4){
    for(var i=0;i<16;i++){var c=buildOne();if(S.misses[c.key]){q=c;break;}}
  }
  return q;
}

/* ======================= RENDU ======================= */
function clearTimer(){if(S.timer){clearTimeout(S.timer);S.timer=null;}}

function showLive(){
  clearTimer();
  S.hi=-1;
  var q=drawQuestion();
  S.cur=q;S.answered=false;S.t0=Date.now();
  paint(q,null,false);
  if(q.type==="input"){input.value="";input.focus();}
  updateNav();
}

function paint(q,given,isReview){
  card.className="card"+(isReview?" rev":"");
  tagEl.textContent=q.tag;
  tagEl.className="tag"+(isReview?" revmark":"");
  qEl.innerHTML=q.q;
  qEl.className="q"+((q.small||strip(q.q).length>85)?" small":"");
  memo.innerHTML=q.h||"";
  memo.hidden=(!S.hints&&!isReview&&given===undefined)||!q.h;
  if(given===null&&!isReview){memo.hidden=!S.hints||!q.h;}
  verdict.textContent="";verdict.className="verdict";

  if(q.type==="qcm"){
    inputZone.hidden=true;optsZone.hidden=false;optsZone.innerHTML="";
    q.options.forEach(function(o,i){
      var b=document.createElement("button");
      b.className="opt";b.type="button";
      b.innerHTML='<span class="lt">'+(i+1)+'</span><span class="ot">'+o+'</span>';
      if(given===null||given===undefined){ b.addEventListener("click",function(){grade(o,b);}); }
      else{
        b.disabled=true;
        if(o===String(q.a))b.classList.add("good");
        else if(o===given)b.classList.add("bad");
      }
      optsZone.appendChild(b);
    });
  }else{
    optsZone.hidden=true;optsZone.innerHTML="";
    inputZone.hidden=isReview||given!==null&&given!==undefined?true:false;
    if(given!==null&&given!==undefined)inputZone.hidden=true;
  }
}

function paintReview(h){
  clearTimer();
  paint(h.q,h.given===null?"":h.given,true);
  memo.innerHTML=h.q.h||"";memo.hidden=!h.q.h;
  inputZone.hidden=true;
  if(h.ok){verdict.textContent="Exact · "+h.t.toFixed(1)+"s";verdict.className="verdict ok";card.className="card rev ok";}
  else{verdict.innerHTML=(h.given===null?"Non répondu — réponse : ":"Ta réponse : "+strip(h.given)+" — réponse : ")+strip(h.q.a);
       verdict.className="verdict ko";card.className="card rev ko";}
  if(h.q.type==="input"){
    optsZone.hidden=false;optsZone.innerHTML="";
    var b=document.createElement("button");b.className="opt good";b.disabled=true;
    b.innerHTML='<span class="lt">✓</span><span>'+strip(h.q.a)+'</span>';
    optsZone.appendChild(b);
  }
  updateNav();
}

function updateNav(){
  var lab=$("navlabel"),p=$("prev"),n=$("nextBtn");
  if(S.hi>=0){
    lab.innerHTML="Correction <b>"+(S.hi+1)+"</b> / "+S.hist.length;
    p.disabled=S.hi<=0;n.disabled=false;
  }else{
    lab.innerHTML=S.answered?"<b>→</b> ou Entrée pour continuer":(S.hist.length?"Question en cours":"");
    p.disabled=S.hist.length===0;n.disabled=false;
  }
}

/* ======================= CORRECTION ======================= */
function norm(s){return String(s).trim().toUpperCase().replace(/\s+/g,"").replace(/,/g,".").replace(/%/g,"").replace(/[''`]/g,"'");}
function same(u,a,tol){
  var nu=norm(u),na=norm(a),fu=parseFloat(nu),fa=parseFloat(na);
  if(!isNaN(fu)&&!isNaN(fa)&&/^-?[\d.]+$/.test(nu)&&/^-?[\d.]+$/.test(na))return Math.abs(fu-fa)<=(tol||1e-4);
  return nu===na;
}

function grade(val,btn){
  if(S.answered||!S.cur||S.hi>=0)return;
  var q=S.cur,el=(Date.now()-S.t0)/1000,ok=val!==null&&same(val,q.a,q.tol);
  S.answered=true;S.total++;

  if(q.type==="qcm"){
    Array.prototype.forEach.call(optsZone.children,function(b){
      b.disabled=true;
      var txt=b.querySelector(".ot").textContent;
      if(txt===String(q.a))b.classList.add("good");
      else if(btn===b)b.classList.add("bad");
    });
  }else{
    inputZone.hidden=true;
    optsZone.hidden=false;optsZone.innerHTML="";
    var g=document.createElement("button");g.className="opt good";g.disabled=true;
    g.innerHTML='<span class="lt">✓</span><span>'+strip(q.a)+'</span>';optsZone.appendChild(g);
  }

  if(ok){
    S.right++;S.streak++;S.times.push(el);
    if(S.misses[q.key]){S.misses[q.key]--;if(S.misses[q.key]<=0){delete S.misses[q.key];delete S.misses[q.key+"|lab"];}}
    verdict.textContent="Exact · "+el.toFixed(1)+"s";verdict.className="verdict ok";card.className="card ok";
  }else{
    S.streak=0;
    S.misses[q.key]=(S.misses[q.key]||0)+1;
    S.misses[q.key+"|lab"]=q.lab||shorten(q.a);
    verdict.innerHTML=(val===null?"Réponse : ":"Faux — ")+strip(q.a);
    verdict.className="verdict ko";card.className="card ko";
    if(q.h){memo.innerHTML=q.h;memo.hidden=false;}
  }

  S.hist.push({q:q,given:val===null?null:String(val),ok:ok,t:el});
  if(S.hist.length>60)S.hist.shift();

  render();persist();updateNav();
  if(S.auto&&ok){clearTimer();S.timer=setTimeout(showLive,750);}
}

function goPrev(){
  clearTimer();
  if(!S.hist.length)return;
  if(S.hi<0)S.hi=S.hist.length-1; else if(S.hi>0)S.hi--;
  paintReview(S.hist[S.hi]);
}
function goNext(){
  clearTimer();
  if(S.hi>=0){
    if(S.hi<S.hist.length-1){S.hi++;paintReview(S.hist[S.hi]);}
    else showLive();
    return;
  }
  if(S.answered)showLive();
  else if(S.cur&&S.cur.type==="input"&&input.value.trim())grade(input.value,null);
}

/* ======================= STATS ======================= */
function render(){
  $("sScore").textContent=S.right+"/"+S.total;
  $("sStreak").textContent=S.streak+(S.streak>=5?" 🔥":"");
  if(S.times.length){var s=0;for(var i=0;i<S.times.length;i++)s+=S.times[i];$("sTime").textContent=(s/S.times.length).toFixed(1)+"s";}
  else $("sTime").textContent="—";
  renderChips();
}
function renderChips(){
  var k=Object.keys(S.misses).filter(function(x){return x.indexOf("|lab")===-1;});
  k.sort(function(a,b){return S.misses[b]-S.misses[a];});
  if(!k.length){chips.innerHTML='<span class="empty">Rien pour l\'instant. Les erreurs reviennent plus souvent.</span>';return;}
  chips.innerHTML=k.slice(0,24).map(function(x){
    var l=S.misses[x+"|lab"]||x,n=S.misses[x];
    return '<span class="chip">'+l+(n>1?'<span>×'+n+'</span>':'')+'</span>';
  }).join("");
}

/* ======================= NAV ======================= */
function drawNav(){
  var sw=$("subtests");sw.innerHTML="";
  SUBTESTS.forEach(function(st){
    if(S.view==="memo"&&st.id==="tout")return;
    var b=document.createElement("button");
    b.className="st";b.textContent=st.name;
    b.setAttribute("aria-pressed",String(st.id===S.sub));
    b.addEventListener("click",function(){
      S.sub=st.id;S.pack="__all__";drawNav();
      if(S.view==="train")showLive(); else drawMemos();
    });
    sw.appendChild(b);
  });
  var pw=$("packs");pw.innerHTML="";
  if(S.view!=="train")return;
  var st=SUBTESTS.filter(function(x){return x.id===S.sub;})[0];
  if(!st.packs)return;
  var all=document.createElement("button");
  all.className="pk";all.textContent="Mélangé";all.setAttribute("aria-pressed",String(S.pack==="__all__"));
  all.addEventListener("click",function(){S.pack="__all__";drawNav();showLive();});
  pw.appendChild(all);
  st.packs.forEach(function(p){
    var b=document.createElement("button");b.className="pk";b.textContent=PN[p]||p;
    b.setAttribute("aria-pressed",String(S.pack===p));
    b.addEventListener("click",function(){S.pack=p;drawNav();showLive();});
    pw.appendChild(b);
  });
}

function drawMemos(){
  var wrap=$("memoBody");wrap.innerHTML="";
  var secs=MEMOS[S.sub];
  if(!secs){wrap.innerHTML='<p class="empty">Choisis un sous-test.</p>';return;}
  secs.forEach(function(sec,idx){
    var d=document.createElement("div");d.className="memosec"+(idx===0?" open":"");
    var hd=document.createElement("button");hd.className="memohd";
    hd.innerHTML='<span>'+sec.t+'</span><span class="arw">▶</span>';
    hd.addEventListener("click",function(){d.classList.toggle("open");});
    var bd=document.createElement("div");bd.className="memobd";
    sec.l.forEach(function(line){
      var i=line.indexOf(" | ");
      var el=document.createElement("div");
      if(i>-1){el.className="ml";el.innerHTML='<span class="t">'+line.slice(0,i)+'</span><span class="d">'+line.slice(i+3)+'</span>';}
      else{el.className="ml plain";el.textContent=line;}
      bd.appendChild(el);
    });
    d.appendChild(hd);d.appendChild(bd);wrap.appendChild(d);
  });
}

function setView(v){
  S.view=v;
  $("vTrain").setAttribute("aria-pressed",String(v==="train"));
  $("vMemo").setAttribute("aria-pressed",String(v==="memo"));
  $("trainView").hidden=v!=="train";
  $("memoView").hidden=v!=="memo";
  if(v==="memo"&&S.sub==="tout")S.sub="calcul";
  drawNav();
  if(v==="memo")drawMemos(); else clearTimer();
}

/* ======================= ÉVÉNEMENTS ======================= */
$("check").addEventListener("click",function(){if(!S.answered&&input.value.trim())grade(input.value,null);});
$("reveal").addEventListener("click",function(){if(!S.answered)grade(null,null);});
input.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();
    if(S.answered)showLive();
    else if(input.value.trim())grade(input.value,null);}
});
document.addEventListener("keydown",function(e){
  if(S.view!=="train")return;
  if(e.key==="ArrowLeft"){e.preventDefault();goPrev();return;}
  if(e.key==="ArrowRight"){e.preventDefault();goNext();return;}
  if(e.key==="Enter"&&document.activeElement!==input){e.preventDefault();goNext();return;}
  if(S.answered||S.hi>=0||!S.cur||S.cur.type!=="qcm")return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=S.cur.options.length){var b=optsZone.children[n-1];if(b)b.click();}
});
$("prev").addEventListener("click",goPrev);
$("nextBtn").addEventListener("click",goNext);
$("hintBtn").addEventListener("click",function(){
  S.hints=!S.hints;this.setAttribute("aria-pressed",String(S.hints));
  if(!S.answered&&S.hi<0)memo.hidden=!S.hints||!(S.cur&&S.cur.h);
});
$("autoBtn").addEventListener("click",function(){
  S.auto=!S.auto;this.setAttribute("aria-pressed",String(S.auto));
  if(!S.auto)clearTimer();
});
$("vTrain").addEventListener("click",function(){setView("train");});
$("vMemo").addEventListener("click",function(){setView("memo");});
$("reset").addEventListener("click",function(){
  S.right=S.total=S.streak=0;S.times=[];S.misses={};S.hist=[];S.hi=-1;
  persist();render();showLive();
});

/* ======================= INIT ======================= */
store.get(function(d){
  if(d&&d.m)S.misses=d.m;
  drawNav();render();showLive();
});
})();
</script>
