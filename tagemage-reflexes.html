<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAGE MAGE — Réflexes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090B; --surface:#121419; --surface-2:#191C22; --line:#242830;
  --text:#ECEEF2; --muted:#7C8492; --dim:#4A505C;
  --accent:#5B8DEF; --ok:#3FB68B; --ko:#E5484D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
  display:flex;justify-content:center;padding:20px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:680px}
.mono{font-family:"JetBrains Mono",monospace}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent)}
.hintswitch{
  background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;
  border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.hintswitch:hover{border-color:var(--muted);color:var(--text)}
.hintswitch[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

/* nav */
.subtests{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.subtests::-webkit-scrollbar{display:none}
.st{
  background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:12px;font-weight:500;padding:9px 14px;border-radius:10px;cursor:pointer;
  white-space:nowrap;transition:.15s;
}
.st:hover{color:var(--text)}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06070A;font-weight:700}
.packs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.pk{
  background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;
  font-size:11.5px;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s;
}
.pk:hover{color:var(--text);border-color:#333844}
.pk[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(91,141,239,.08)}

/* card */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:30px 24px 26px;text-align:center;position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease;
}
.card.ok::after{background:var(--ok);transform:scaleX(1)}
.card.ko::after{background:var(--ko);transform:scaleX(1)}
.tag{
  display:inline-block;background:var(--surface-2);color:var(--muted);font-size:9.5px;
  font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;
  border-radius:999px;margin-bottom:22px;
}
.q{font-size:clamp(19px,4.4vw,27px);font-weight:700;line-height:1.3}
.q.small{font-size:clamp(16px,3.4vw,20px);font-weight:500;line-height:1.45}
.memo{
  margin-top:22px;text-align:left;background:var(--surface-2);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:12px 15px;font-size:13px;line-height:1.55;color:#B6BDC9;
}
.memo b{color:var(--text);font-weight:500}
.memo[hidden]{display:none}
.verdict{margin-top:18px;min-height:20px;font-size:13px;font-weight:500;font-family:"JetBrains Mono",monospace;line-height:1.5}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}

/* options */
.opts{display:grid;gap:8px;margin-top:20px;text-align:left}
.opt{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  font-family:inherit;font-size:14.5px;line-height:1.4;padding:13px 16px;border-radius:11px;
  cursor:pointer;transition:.12s;display:flex;gap:11px;align-items:flex-start;text-align:left;
}
.opt:hover:not(:disabled){background:#22262E;border-color:#333844}
.opt .lt{
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--dim);
  flex-shrink:0;padding-top:1px;
}
.opt.good{border-color:var(--ok);background:rgba(63,182,139,.1)}
.opt.good .lt{color:var(--ok)}
.opt.bad{border-color:var(--ko);background:rgba(229,72,77,.1)}
.opt.bad .lt{color:var(--ko)}
.opt:disabled{cursor:default}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.stat{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:700;margin-top:4px}

/* input */
.row{display:flex;gap:8px;margin-bottom:8px}
#answer{
  flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 17px;color:var(--text);font-family:"JetBrains Mono",monospace;
  font-size:19px;font-weight:500;outline:none;transition:.15s;min-width:0;
}
#answer:focus{border-color:var(--accent)}
#answer::placeholder{color:#3E4450}
.btn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;
  font-size:14px;font-weight:500;padding:14px 22px;border-radius:12px;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:#22262E}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06070A;font-weight:700}
.btn.primary:hover{background:#6E9BF2}
.btn.wide{width:100%;color:var(--muted);font-size:13px}
.btn.wide:hover{color:var(--text)}
#inputZone[hidden],#optsZone[hidden]{display:none}

.review{margin-top:24px}
.review h2{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:rgba(229,72,77,.09);border:1px solid rgba(229,72,77,.26);color:#F09296;
  font-size:12px;padding:5px 10px;border-radius:8px;max-width:100%;
}
.chip span{color:#8A5C5F;margin-left:5px}
.empty{color:var(--dim);font-size:13px}
.foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--dim);font-size:11px}
.foot button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.foot button:hover{color:var(--muted)}
@media (max-width:420px){ .btn{padding:14px 15px} .opt{font-size:13.5px;padding:12px 13px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">TAGE MAGE · <b>Réflexes</b></div>
    <button class="hintswitch" id="hintBtn" aria-pressed="true">Indices</button>
  </header>

  <div class="subtests" id="subtests"></div>
  <div class="packs" id="packs"></div>

  <div class="card" id="card">
    <div class="tag" id="tag">—</div>
    <div class="q" id="question">—</div>
    <div class="opts" id="optsZone"></div>
    <div class="memo" id="memo" hidden></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Score</div><div class="v" id="sScore">0/0</div></div>
    <div class="stat"><div class="k">Série</div><div class="v" id="sStreak">0</div></div>
    <div class="stat"><div class="k">Temps moy.</div><div class="v" id="sTime">—</div></div>
  </div>

  <div id="inputZone">
    <div class="row">
      <input id="answer" autocomplete="off" spellcheck="false" placeholder="Réponse">
      <button class="btn primary" id="check">Vérifier</button>
    </div>
    <button class="btn wide" id="reveal">Voir la réponse</button>
  </div>

  <div class="review">
    <h2>À revoir</h2>
    <div class="chips" id="chips"><span class="empty">Rien pour l'instant. Les erreurs reviendront plus souvent.</span></div>
  </div>

  <div class="foot">
    <span>Entrée valide et enchaîne · 1-4 pour les QCM</span>
    <button id="reset">Remettre à zéro</button>
  </div>
</div>

  rangInv:{name:"Rang inversé (Z=1)",tag:"Alphabet inversé",kind:"gen",gen:function(){

    return {key:"AI"+n,q:'Rang de <span class="mono">« '+L+' »</span> en partant de Z ?',a:String(n),lab:L+"↩"+n,
      h:"<b>Astuce</b> — rang inversé = 27 − rang normal. Ici « "+L+" » vaut "+(27-n)+" à l'endroit."};
  }},
  decal:{name:"Décalages alphabétiques",tag:"Décalage",kind:"gen",gen:function(){
    var i=ri(0,25),d=ri(2,9),sign=Math.random()<.5?1:-1;
    var j=((i+sign*d)%26+26)%26;
    return {key:"D"+i+"_"+(sign*d),q:'Quelle lettre à <span class="mono">'+(sign>0?"+":"−")+d+'</span> de <span class="mono">« '+LETTERS[i]+' »</span> ?',
      a:LETTERS[j],lab:LETTERS[i]+(sign>0?"+":"−")+d+"="+LETTERS[j],
      h:"<b>Méthode</b> — passe par le rang : "+LETTERS[i]+" = "+(i+1)+", "+(sign>0?"+":"−")+d+" → "+(j+1)+"."};
  }},
  series:{name:"Séries express",tag:"Séries",kind:"gen",gen:function(){
    var t=ri(1,6),s=[],ans,h;
    if(t===1){var a=ri(2,12),r=ri(2,9);for(var i=0;i<5;i++)s.push(a+i*r);ans=a+5*r;h="<b>Écarts constants</b> — raison "+r+".";}
    else if(t===2){var a2=ri(2,5),q2=ri(2,3);for(var i2=0;i2<5;i2++)s.push(a2*Math.pow(q2,i2));ans=a2*Math.pow(q2,5);h="<b>Raison multiplicative</b> — ×"+q2+" à chaque terme.";}
    else if(t===3){var a3=ri(1,6),r3=ri(2,5),d3=ri(1,4),c=a3;s.push(c);for(var i3=0;i3<4;i3++){c+=r3+i3*d3;s.push(c);}ans=c+r3+4*d3;h="<b>Écarts croissants</b> — la différence augmente de "+d3+" à chaque pas.";}
    else if(t===4){var a4=ri(2,9),x=ri(2,4),y=ri(1,6),c4=a4;s.push(c4);for(var i4=0;i4<5;i4++){c4=(i4%2===0)?c4*x:c4+y;s.push(c4);}ans=(5%2===0)?s[5]*x:s[5]+y;s=s.slice(0,6);h="<b>Alternance</b> — un coup ×"+x+", un coup +"+y+".";}
    else if(t===5){var st=ri(2,8);for(var i5=0;i5<5;i5++)s.push((st+i5)*(st+i5));ans=(st+5)*(st+5);h="<b>Carrés successifs</b> — reconnais "+st+"², "+(st+1)+"², etc.";}
    else{var f1=ri(1,5),f2=ri(2,8);s=[f1,f2];for(var i6=0;i6<4;i6++)s.push(s[s.length-1]+s[s.length-2]);ans=s[s.length-1]+s[s.length-2];h="<b>Additive</b> — chaque terme est la somme des deux précédents.";}
    return {key:"S"+t+"_"+s[0]+"_"+s[1],q:'<span class="mono">'+s.join(" — ")+' — ?</span>',a:String(ans),
      lab:s.slice(0,3).join(",")+"…",h:h};
  }},
  formelle:qcm(FORMELLE,"Logique formelle"),

  /* --------- RAISONNEMENT --------- */
  sophismes:qcm(SOPHISMES,"Sophismes"),
  sophismesR:qcm(SOPHISMES,"Sophismes",true),
  raisonnements:qcm(RAISONNEMENTS,"Raisonnements"),

  /* --------- CONDITIONS MINIMALES --------- */
  cmSens:qcm(CM_SENS,"Sens des réponses"),
  cmDrill:{name:"Réflexe A/B/C/D/E",tag:"Conditions minimales",kind:"gen",qcmGen:true,gen:function(){
    var i=Math.random()<.5,ii=Math.random()<.5,both;
    var ans,h;
    if(i&&ii){ans="D";h="Chacune suffit seule → <b>D</b>.";}
    else if(i&&!ii){ans="A";h="Seule I suffit → <b>A</b>.";}
    else if(!i&&ii){ans="B";h="Seule II suffit → <b>B</b>.";}
    else{both=Math.random()<.5;ans=both?"C":"E";h=both?"Aucune seule, mais les deux ensemble → <b>C</b>.":"Même ensemble, insuffisant → <b>E</b>.";}
    var txt="I seule suffit : <b>"+(i?"oui":"non")+"</b> · II seule suffit : <b>"+(ii?"oui":"non")+"</b>";
    if(!i&&!ii) txt+=" · les deux ensemble : <b>"+(both?"oui":"non")+"</b>";
    return {key:"CM"+(i?1:0)+(ii?1:0)+(both?1:0),q:txt+"<br>Quelle réponse ?",a:ans,
      opts:["A","B","C","D","E"],lab:"CM "+ans,h:h+" Le réflexe : tester I seule, puis II seule, puis les deux."};
  }},

  /* --------- EXPRESSION --------- */
  proverbes:qcm(PROVERBES,"Proverbes"),
  proverbesR:qcm(PROVERBES,"Proverbes",true),
  expressions:qcm(EXPRESSIONS,"Expressions"),
  paronymes:qcm(PARONYMES,"Paronymes"),
  pleonasmes:{kind:"qcm",tag:"Pléonasmes",items:PLEONASMES.map(function(p,i){
    return {key:"PL"+i,q:'« <b>'+p[0]+'</b> » — quelle est la forme correcte ?',a:p[1],
      h:"<b>Pléonasme</b> — le second terme répète une idée déjà contenue dans le premier."};
  })},
  figures:qcm(FIGURES,"Figures de style"),
  fautes:{kind:"qcm",tag:"Fautes classiques",items:FAUTES.map(function(f,i){
    return {key:"FT"+i,q:f.q,a:f.a,opts:[f.a].concat(f.o),h:f.h,small:true};
  })},

  /* --------- COMPRÉHENSION --------- */
  vocab:qcm(VOCAB,"Vocabulaire"),
  vocabR:qcm(VOCAB,"Vocabulaire",true),
  connecteurs:qcm(CONNECTEURS,"Connecteurs")
};

var SUBTESTS=[
  {id:"calcul",name:"Calcul",packs:["carres","cubes","puiss","fractions","tables","racines","premiers","formules","divisib"]},
  {id:"logique",name:"Logique",packs:["rang","rangInv","decal","series","formelle"]},
  {id:"raisonnement",name:"Raisonnement",packs:["sophismes","sophismesR","raisonnements","formelle"]},
  {id:"condmin",name:"Cond. minimales",packs:["cmDrill","cmSens"]},
  {id:"expression",name:"Expression",packs:["proverbes","proverbesR","expressions","paronymes","fautes","pleonasmes","figures"]},
  {id:"comprehension",name:"Compréhension",packs:["vocab","vocabR","connecteurs","paronymes"]},
  {id:"tout",name:"Tout",packs:null}
];
var PACKNAMES={
  carres:"Carrés",cubes:"Cubes",puiss:"Puissances",fractions:"Fractions ↔ %",tables:"Tables 11-19",
  racines:"Racines",premiers:"Premiers",formules:"Formules",divisib:"Divisibilité",
  rang:"Rang lettres",rangInv:"Rang inversé",decal:"Décalages",series:"Séries",formelle:"Logique formelle",
  sophismes:"Sophismes",sophismesR:"Sophismes ↔",raisonnements:"Types de raisonnement",
  cmDrill:"Réflexe A→E",cmSens:"Sens des réponses",
  proverbes:"Proverbes",proverbesR:"Proverbes ↔",expressions:"Expressions",paronymes:"Paronymes",
  fautes:"Fautes classiques",pleonasmes:"Pléonasmes",figures:"Figures de style",
  vocab:"Vocabulaire",vocabR:"Vocabulaire ↔",connecteurs:"Connecteurs"
};

/* ============================ ENGINE ============================ */
var S={sub:"calcul",pack:"__all__",hints:true,right:0,total:0,streak:0,times:[],misses:{},cur:null,answered:false,t0:0};
var $=function(i){return document.getElementById(i);};
var card=$("card"),tagEl=$("tag"),qEl=$("question"),memo=$("memo"),verdict=$("verdict"),
    input=$("answer"),chips=$("chips"),optsZone=$("optsZone"),inputZone=$("inputZone");

var KEY="tm-reflexes-v1";
function save(){ if(!window.storage)return; try{window.storage.set(KEY,JSON.stringify({m:S.misses}),false);}catch(e){} }
function load(){
  if(!window.storage){renderChips();return;}
  try{ window.storage.get(KEY,false).then(function(r){
    if(r&&r.value){var d=JSON.parse(r.value);S.misses=d.m||{};}
    renderChips();
  }).catch(function(){renderChips();}); }catch(e){renderChips();}
}

function activePacks(){
  var st=SUBTESTS.filter(function(x){return x.id===S.sub;})[0];
  var list = st.packs ? st.packs.slice() : Object.keys(PACKS);
  if(S.pack!=="__all__" && list.indexOf(S.pack)>-1) list=[S.pack];
  return list;
}

function buildOne(){
  var id=pick(activePacks()), P=PACKS[id];
  if(P.kind==="gen"){
    var it=P.gen();
    it.tag=P.tag; it.packId=id;
    it.type = it.opts ? "qcm" : "input";
    if(it.opts){ it.options=shuffle(it.opts.slice()); }
    return it;
  }
  var item=pick(P.items);
  var opts=item.opts;
  if(!opts){
    var pool=P.items.filter(function(x){return x.a!==item.a;});
    var d=[];shuffle(pool);
    for(var i=0;i<pool.length&&d.length<3;i++){ if(d.indexOf(pool[i].a)===-1) d.push(pool[i].a); }
    opts=[item.a].concat(d);
  }
  return {key:P.tag+"|"+item.key,q:item.q,a:item.a,options:shuffle(opts.slice()),
          tag:P.tag,type:"qcm",h:item.h,lab:item.lab||shorten(item.a),small:item.small,packId:id};
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function shorten(s){s=String(s).replace(/<[^>]+>/g,"");return s.length>26?s.slice(0,24)+"…":s;}

function next(){
  var q=buildOne();
  var missed=Object.keys(S.misses).filter(function(k){return k.indexOf("|lab")===-1;});
  if(missed.length&&Math.random()<.4){
    for(var i=0;i<14;i++){var c=buildOne();if(S.misses[c.key]){q=c;break;}}
  }
  S.cur=q;S.answered=false;S.t0=Date.now();
  tagEl.textContent=q.tag;
  qEl.innerHTML=q.q;
  qEl.className="q"+(q.small||q.q.length>90?" small":"");
  memo.innerHTML=q.h||"";
  memo.hidden=!S.hints||!q.h;
  verdict.textContent="";verdict.className="verdict";card.className="card";

  if(q.type==="qcm"){
    inputZone.hidden=true;optsZone.hidden=false;
    optsZone.innerHTML="";
    q.options.forEach(function(o,i){
      var b=document.createElement("button");
      b.className="opt";b.type="button";
      b.innerHTML='<span class="lt">'+(i+1)+'</span><span>'+o+'</span>';
      b.addEventListener("click",function(){grade(o,b);});
      optsZone.appendChild(b);
    });
  }else{
    optsZone.hidden=true;optsZone.innerHTML="";inputZone.hidden=false;
    input.value="";input.focus();
  }
}

function norm(s){return String(s).trim().toUpperCase().replace(/\s+/g,"").replace(/,/g,".").replace(/%/g,"").replace(/[''`]/g,"'");}
function same(u,a,tol){
  var fu=parseFloat(norm(u)),fa=parseFloat(norm(a));
  if(!isNaN(fu)&&!isNaN(fa)&&/^-?[\d.]+$/.test(norm(u))&&/^-?[\d.]+$/.test(norm(a))){
    return Math.abs(fu-fa)<=(tol||0.0001);
  }
  return norm(u)===norm(a);
}

function grade(val,btn){
  if(S.answered||!S.cur)return;
  var q=S.cur,el=(Date.now()-S.t0)/1000;
  var ok = val!==null && same(val,q.a,q.tol);
  S.answered=true;S.total++;

  if(q.type==="qcm"){
    Array.prototype.forEach.call(optsZone.children,function(b){
      b.disabled=true;
      var txt=b.lastChild.textContent;
      if(txt===String(q.a)) b.classList.add("good");
      else if(btn===b) b.classList.add("bad");
    });
  }
  if(ok){
    S.right++;S.streak++;S.times.push(el);
    if(S.misses[q.key]){S.misses[q.key]--;if(S.misses[q.key]<=0){delete S.misses[q.key];delete S.misses[q.key+"|lab"];}}
    verdict.textContent="Exact · "+el.toFixed(1)+"s";verdict.className="verdict ok";card.className="card ok";
  }else{
    S.streak=0;
    S.misses[q.key]=(S.misses[q.key]||0)+1;
    S.misses[q.key+"|lab"]=q.lab||shorten(q.a);
    verdict.innerHTML=(val===null?"Réponse : ":"Faux — ")+String(q.a).replace(/<[^>]+>/g,"");
    verdict.className="verdict ko";card.className="card ko";
    if(!S.hints&&q.h){memo.innerHTML=q.h;memo.hidden=false;}
  }
  render();save();
  setTimeout(next, ok?700:(q.type==="qcm"?2200:1700));
}

function render(){
  $("sScore").textContent=S.right+"/"+S.total;
  $("sStreak").textContent=S.streak+(S.streak>=5?" 🔥":"");
  if(S.times.length){var s=0;for(var i=0;i<S.times.length;i++)s+=S.times[i];$("sTime").textContent=(s/S.times.length).toFixed(1)+"s";}
  else $("sTime").textContent="—";
  renderChips();
}
function renderChips(){
  var k=Object.keys(S.misses).filter(function(x){return x.indexOf("|lab")===-1;});
  k.sort(function(a,b){return S.misses[b]-S.misses[a];});
  if(!k.length){chips.innerHTML='<span class="empty">Rien pour l\'instant. Les erreurs reviendront plus souvent.</span>';return;}
  chips.innerHTML=k.slice(0,22).map(function(x){
    var l=S.misses[x+"|lab"]||x,n=S.misses[x];
    return '<span class="chip">'+l+(n>1?'<span>×'+n+'</span>':'')+'</span>';
  }).join("");
}

/* nav */
function drawNav(){
  var sw=$("subtests");sw.innerHTML="";
  SUBTESTS.forEach(function(st){
    var b=document.createElement("button");
    b.className="st";b.textContent=st.name;b.dataset.id=st.id;
    b.setAttribute("aria-pressed",String(st.id===S.sub));
    b.addEventListener("click",function(){S.sub=st.id;S.pack="__all__";drawNav();next();});
    sw.appendChild(b);
  });
  var pw=$("packs");pw.innerHTML="";
  var st=SUBTESTS.filter(function(x){return x.id===S.sub;})[0];
  if(!st.packs){pw.innerHTML="";return;}
  var all=document.createElement("button");
  all.className="pk";all.textContent="Mélangé";all.setAttribute("aria-pressed",String(S.pack==="__all__"));
  all.addEventListener("click",function(){S.pack="__all__";drawNav();next();});
  pw.appendChild(all);
  st.packs.forEach(function(p){
    var b=document.createElement("button");
    b.className="pk";b.textContent=PACKNAMES[p]||p;
    b.setAttribute("aria-pressed",String(S.pack===p));
    b.addEventListener("click",function(){S.pack=p;drawNav();next();});
    pw.appendChild(b);
  });
}

/* events */
$("check").addEventListener("click",function(){if(!S.answered&&input.value.trim())grade(input.value,null);});
$("reveal").addEventListener("click",function(){if(!S.answered)grade(null,null);});
input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!S.answered&&input.value.trim())grade(input.value,null);}});
document.addEventListener("keydown",function(e){
  if(S.answered||!S.cur||S.cur.type!=="qcm")return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=S.cur.options.length){var b=optsZone.children[n-1];if(b)b.click();}
});
$("hintBtn").addEventListener("click",function(){
  S.hints=!S.hints;this.setAttribute("aria-pressed",String(S.hints));
  memo.hidden=!S.hints||!(S.cur&&S.cur.h);
});
$("reset").addEventListener("click",function(){
  S.right=S.total=S.streak=0;S.times=[];S.misses={};save();render();next();
});

drawNav();load();render();next();
})();
</script>
</body>
</html>
